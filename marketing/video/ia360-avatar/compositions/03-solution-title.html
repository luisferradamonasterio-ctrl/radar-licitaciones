<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; font-family: 'Inter', sans-serif; }
  </style>
</head>
<body>
  <div
    data-composition-id="solution-title"
    data-duration="3"
    data-width="1920"
    data-height="1080"
    style="width:1920px;height:1080px;display:flex;align-items:center;justify-content:center;
           background:linear-gradient(135deg,#0D1B2A 0%,#0A0A0F 100%);"
  >
    <div style="display:flex;flex-direction:column;align-items:center;gap:24px;text-align:center;">
      <div id="pill" style="
        background:rgba(21,101,192,0.2);
        border:1px solid rgba(0,229,255,0.4);
        border-radius:100px;padding:10px 32px;
        font-size:16px;letter-spacing:4px;color:#00E5FF;text-transform:uppercase;
        opacity:0;
      ">La solución</div>
      <div id="title" style="font-size:90px;font-weight:800;line-height:1.05;color:#F0F4F8;opacity:0;">
        Conoce <span style="
          background:linear-gradient(90deg,#00E5FF,#00B4D8);
          -webkit-background-clip:text;-webkit-text-fill-color:transparent;
        ">IA-360</span>
      </div>
      <div id="sub" style="font-size:28px;color:#8899AA;max-width:800px;line-height:1.4;opacity:0;">
        El asistente de IA que habla el idioma de su organización
      </div>
    </div>
  </div>
  <script>
    gsap.to("#pill",  { opacity: 1, y: 0, duration: 0.6, ease: "power2.out", delay: 0.1 });
    gsap.from("#pill", { y: -20, duration: 0.6, ease: "power2.out", delay: 0.1 });
    gsap.to("#title", { opacity: 1, y: 0, duration: 0.8, ease: "power3.out", delay: 0.4 });
    gsap.from("#title", { y: 40, duration: 0.8, ease: "power3.out", delay: 0.4 });
    gsap.to("#sub",   { opacity: 1, duration: 0.7, delay: 0.9 });
  </script>
</body>
</html>
