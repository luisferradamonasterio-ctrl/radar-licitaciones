<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; font-family: 'Inter', sans-serif; }
  </style>
</head>
<body>
  <div
    data-composition-id="social-proof"
    data-duration="4"
    data-width="1920"
    data-height="1080"
    style="width:1920px;height:1080px;display:flex;align-items:center;justify-content:center;
           background:linear-gradient(135deg,#0D1B2A,#0A0A0F);"
  >
    <div style="display:flex;flex-direction:column;align-items:center;gap:30px;text-align:center;max-width:1100px;">
      <div id="quote" style="font-size:100px;color:#00E5FF;line-height:0.6;opacity:0;">"</div>
      <div id="stat" style="
        font-size:100px;font-weight:800;
        background:linear-gradient(135deg,#00E5FF,#F0F4F8);
        -webkit-background-clip:text;-webkit-text-fill-color:transparent;
        opacity:0;
      ">−74% tiempo de respuesta</div>
      <div id="desc" style="font-size:32px;color:#F0F4F8;line-height:1.4;opacity:0;">
        en consultas ciudadanas sin ampliar el equipo de atención
      </div>
      <div id="src" style="font-size:19px;color:#8899AA;opacity:0;">
        — Organismo del Sector Público · Cliente IA-360
      </div>
    </div>
  </div>
  <script>
    gsap.to("#quote", { opacity: 1, y: 0, duration: 0.5, delay: 0.1 });
    gsap.from("#quote", { y: -20, duration: 0.5, delay: 0.1 });
    gsap.to("#stat",  { opacity: 1, y: 0, duration: 0.8, ease: "power3.out", delay: 0.4 });
    gsap.from("#stat", { y: 50, duration: 0.8, ease: "power3.out", delay: 0.4 });
    gsap.to("#desc",  { opacity: 1, duration: 0.6, delay: 0.9 });
    gsap.to("#src",   { opacity: 1, duration: 0.5, delay: 1.3 });
  </script>
</body>
</html>
