<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; font-family: 'Inter', sans-serif; }
  </style>
</head>
<body>
  <div
    data-composition-id="cta"
    data-duration="5"
    data-width="1920"
    data-height="1080"
    style="width:1920px;height:1080px;display:flex;align-items:center;justify-content:center;
           background:radial-gradient(ellipse at center, rgba(21,101,192,0.35) 0%, #0A0A0F 65%);"
  >
    <div style="display:flex;flex-direction:column;align-items:center;gap:32px;text-align:center;">
      <div id="logo" style="
        font-size:42px;font-weight:800;letter-spacing:5px;
        background:linear-gradient(90deg,#00E5FF,#F0F4F8);
        -webkit-background-clip:text;-webkit-text-fill-color:transparent;
        opacity:0;
      ">IA-360</div>
      <div id="headline" style="font-size:76px;font-weight:800;line-height:1.1;color:#F0F4F8;max-width:1000px;opacity:0;">
        ¿Listo para su <span style="
          background:linear-gradient(90deg,#00E5FF,#00B4D8);
          -webkit-background-clip:text;-webkit-text-fill-color:transparent;
        ">demo gratuita?</span>
      </div>
      <div id="sub" style="font-size:26px;color:#8899AA;opacity:0;">
        Sin compromiso · Sin tecnicismos · Solo resultados
      </div>
      <div id="btn" style="
        margin-top:12px;padding:26px 80px;
        background:linear-gradient(135deg,#1565C0,#00B4D8);
        border-radius:100px;font-size:28px;font-weight:700;
        color:#fff;letter-spacing:1px;opacity:0;
      ">Solicitar Demo →</div>
      <div id="url" style="font-size:22px;color:#8899AA;opacity:0;">
        innova-net.cl · ia360.cl
      </div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ delay: 0.2 });
    tl.to("#logo",     { opacity: 1, y: 0, duration: 0.5 })
      .from("#logo",   { y: -20, duration: 0.5 }, "<")
      .to("#headline", { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, "-=0.2")
      .from("#headline",{ y: 40, duration: 0.7, ease: "power3.out" }, "<")
      .to("#sub",      { opacity: 1, duration: 0.5 }, "-=0.1")
      .to("#btn",      { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.5)" }, "-=0.1")
      .from("#btn",    { scale: 0.85, duration: 0.6, ease: "back.out(1.5)" }, "<")
      .to("#url",      { opacity: 1, duration: 0.4 }, "-=0.2");
  </script>
</body>
</html>
